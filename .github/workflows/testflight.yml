name: CartCompare → TestFlight

# Builds the CartCompare iOS app on a cloud Mac and uploads it to TestFlight.
# No local Mac or Xcode needed. Trigger manually from the Actions tab, or via API.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID   — 10-char Team ID (developer.apple.com → Membership)
#   ASC_KEY_ID      — App Store Connect API key's Key ID
#   ASC_ISSUER_ID   — App Store Connect API Issuer ID
#   ASC_KEY_P8      — full contents of the downloaded AuthKey_XXXX.p8 file

on:
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: cartcompare-ios
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Select newest Xcode (Apple requires the iOS 26 SDK or later)
        run: |
          latest="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "Selecting $latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version

      - name: Install web dependencies and sync iOS project
        run: |
          npm ci
          npx cap sync ios
          # cap sync only scans npm packages for native plugin classes; add our
          # in-app OCR plugin to the auto-registration list it generates.
          python3 - <<'PYEOF'
          import json
          p = 'ios/App/App/capacitor.config.json'
          cfg = json.load(open(p))
          cls = cfg.setdefault('packageClassList', [])
          if 'TextRecognizerPlugin' not in cls:
              cls.append('TextRecognizerPlugin')
          json.dump(cfg, open(p, 'w'), indent='\t')
          print('packageClassList:', cls)
          PYEOF

      - name: Prepare signing credentials
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          RAW_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          RAW_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          RAW_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Trim stray whitespace from the ID secrets and export for later steps
          {
            echo "ASC_KEY_ID=$(printf %s "$RAW_KEY_ID" | tr -d '[:space:]')"
            echo "ASC_ISSUER_ID=$(printf %s "$RAW_ISSUER_ID" | tr -d '[:space:]')"
            echo "APPLE_TEAM_ID=$(printf %s "$RAW_TEAM_ID" | tr -d '[:space:]')"
          } >> "$GITHUB_ENV"

          # Rebuild a valid PEM from the pasted key, tolerating lost newlines,
          # missing BEGIN/END lines, CRLF endings, or base64-wrapped file content.
          export ASC_KEY_ID_TRIMMED="$(printf %s "$RAW_KEY_ID" | tr -d '[:space:]')"
          python3 - <<'PYEOF'
          import os, re, base64, sys, textwrap
          s = os.environ['ASC_KEY_P8'].replace('\\n', '\n').replace('\r', '').strip()
          if 'BEGIN' not in s:
              try:
                  dec = base64.b64decode(''.join(s.split())).decode('utf-8', 'ignore')
                  if 'BEGIN' in dec:
                      s = dec.replace('\r', '').strip()
              except Exception:
                  pass
          m = re.search(r'-----BEGIN[A-Z ]*-----(.*?)-----END', s, re.S)
          body = m.group(1) if m else s
          b64 = ''.join(body.split())
          try:
              raw = base64.b64decode(b64, validate=True)
              assert len(raw) > 50
          except Exception:
              print('::error::The ASC_KEY_P8 secret is not a readable key. Delete the secret and re-add it: open the downloaded AuthKey_*.p8 file in TextEdit, Select All, Copy, and paste everything into the secret value.')
              sys.exit(1)
          pem = '-----BEGIN PRIVATE KEY-----\n' + '\n'.join(textwrap.wrap(b64, 64)) + '\n-----END PRIVATE KEY-----\n'
          path = os.path.expanduser('~/private_keys/AuthKey_%s.p8' % os.environ['ASC_KEY_ID_TRIMMED'])
          os.makedirs(os.path.dirname(path), exist_ok=True)
          with open(path, 'w') as f:
              f.write(pem)
          print('API key file rebuilt')
          PYEOF
          openssl pkey -in "$HOME/private_keys/AuthKey_${ASC_KEY_ID_TRIMMED}.p8" -noout \
            && echo "API key validates as a proper private key" \
            || { echo "::error::Key material decodes but is not a valid private key — re-download a fresh API key from App Store Connect and update the ASC_KEY_P8 secret."; exit 1; }

      - name: Free certificate slots (revoke stale CI development certs)
        run: |
          pip3 install --quiet PyJWT cryptography || pip3 install --quiet --user --break-system-packages PyJWT cryptography
          python3 - <<'PYEOF'
          import os, time, json, urllib.request, urllib.error
          import jwt
          key = open(os.path.expanduser('~/private_keys/AuthKey_%s.p8' % os.environ['ASC_KEY_ID'])).read()
          now = int(time.time())
          token = jwt.encode(
              {'iss': os.environ['ASC_ISSUER_ID'], 'iat': now - 30, 'exp': now + 900, 'aud': 'appstoreconnect-v1'},
              key, algorithm='ES256', headers={'kid': os.environ['ASC_KEY_ID']})
          if isinstance(token, bytes):
              token = token.decode()
          def req(method, url):
              r = urllib.request.Request(url, method=method, headers={'Authorization': 'Bearer ' + token})
              try:
                  with urllib.request.urlopen(r) as resp:
                      return resp.status, resp.read()
              except urllib.error.HTTPError as e:
                  return e.code, e.read()
          # Development certificates are disposable per-machine credentials; CI
          # mints a fresh one every run. Revoking them never affects TestFlight,
          # the App Store, or distribution certs.
          status, body = req('GET', 'https://api.appstoreconnect.apple.com/v1/certificates?filter%5BcertificateType%5D=DEVELOPMENT,IOS_DEVELOPMENT&limit=200')
          if status != 200:
              print('::warning::could not list certificates (HTTP %s) — continuing' % status)
              raise SystemExit(0)
          certs = json.loads(body or b'{}').get('data', [])
          print('development certificates found:', len(certs))
          for c in certs:
              s, _ = req('DELETE', 'https://api.appstoreconnect.apple.com/v1/certificates/' + c['id'])
              print(('revoked' if s == 204 else 'failed(%s)' % s), c['id'],
                    c.get('attributes', {}).get('displayName', ''))
          PYEOF

      - name: Archive (cloud-managed signing)
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            MARKETING_VERSION=1.0 \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Upload to TestFlight
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
